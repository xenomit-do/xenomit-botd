# Builds, signs, and publishes the botd image to GHCR, then dispatches a
# narrowly scoped workflow_dispatch to xenomit-do/xenomit-deployments.
#
# The image needs the whole Xenomit workspace: ci/source-pins.json pins every
# sibling dependency to an immutable SHA and ci/checkout-sources.sh
# materializes it. Docker context = parent workspace (see Dockerfile header).
#
# Secrets:
#   APP_ID, APP_PRIVATE_KEY — org secrets for the image-publish GitHub App,
#   restricted to the image source repos. The minted installation token is
#   scoped to xenomit-deployments with contents:write solely for dispatch.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: image-botd
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/xenomit-do/xenomit-botd

jobs:
  publish:
    # main-only: push is already branch-filtered; this also guards manual
    # dispatch to refs/heads/main.
    if: github.ref == 'refs/heads/main'
    runs-on: xenomit-build
    timeout-minutes: 120
    steps:
      - name: Checkout botd
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: xenomit-botd
          persist-credentials: false

      - name: Materialize pinned workspace
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: ./xenomit-botd/ci/checkout-sources.sh .

      - name: Set up buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ github.workspace }}
          file: xenomit-botd/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
        with:
          cosign-release: "v2.4.3"

      - name: Sign image by digest (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Mint deployments dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: xenomit-do
          repositories: xenomit-deployments
          permission-actions: write

      - name: Dispatch image-published to xenomit-deployments
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_NAME: botd
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "::add-mask::$APP_TOKEN"
          payload=$(jq -n \
            --arg image "$IMAGE_NAME" \
            --arg digest "$DIGEST" \
            --arg repo "$SOURCE_REPOSITORY" \
            --arg sha "$SOURCE_SHA" \
            '{ref: "main", inputs: {
               image: $image, digest: $digest,
               source_repository: $repo, source_sha: $sha}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer $APP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/xenomit-do/xenomit-deployments/actions/workflows/promote-image.yml/dispatches" \
            -d "$payload"
