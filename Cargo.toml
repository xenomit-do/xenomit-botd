[package]
name = "xenomit-botd"
version = "0.1.0"
edition = "2024"
description = "Headless Xenomit bot daemon: config-driven credentials, packet-client attach, panel agent and health endpoints"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "io-util", "sync", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "channel", "codegen"] }
tonic-prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
fleet-types = { git = "https://github.com/xenomit-do/xenomit-orchestrator", tag = "v0.1.0", package = "fleet-types" }
async-trait = "0.1"
xenomit-bot-runtime = { git = "https://github.com/xenomit-do/xenomit-bot-runtime", tag = "v0.1.0" }
xenomit-packet-client = { git = "https://github.com/xenomit-do/xenomit-packet-client", tag = "v0.1.0" }
xenomit_backpage = { git = "https://github.com/xenomit-do/xenomit-backpage", tag = "v0.1.0" }
xenomit-behavior-engine = { git = "https://github.com/xenomit-do/xenomit-behavior-engine", tag = "v0.1.0" }
xenomit-game-api = { git = "https://github.com/xenomit-do/xenomit-game-api", tag = "v0.1.0" }
xenomit_core = { git = "https://github.com/xenomit-do/xenomit-core", tag = "v0.1.0" }

[dev-dependencies]
tempfile = "3"
# Test builds get the in-memory OTLP capture (`xenomit_core::logging::testing`).
xenomit_core = { git = "https://github.com/xenomit-do/xenomit-core", tag = "v0.1.0", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
xenomit-mock-game = { git = "https://github.com/xenomit-do/xenomit-mock-game", tag = "v0.1.0" }
xenomit-bot-runtime = { git = "https://github.com/xenomit-do/xenomit-bot-runtime", tag = "v0.1.0" }
xenomit-game-api = { git = "https://github.com/xenomit-do/xenomit-game-api", tag = "v0.1.0" }
sysinfo = "0.31"
axum = "0.8"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# 50-bot fleet benchmark against the embedded mock — `cargo bench --bench fleet`.
[[bench]]
name = "fleet"
harness = false
